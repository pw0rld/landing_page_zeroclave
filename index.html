<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="ZeroClave 为企业提供可信 AI 安全计算基础设施。">
    <meta name="theme-color" content="#020c09">
    <title>ZeroClave | 通往可信人工智能的安全网关</title>
    <link rel="icon" type="image/png" href="/assets/zeroclave-favicon.png">
    <script>
      (() => {
        const storageKey = 'zeroclave-theme';
        let savedTheme = null;

        try {
          savedTheme = localStorage.getItem(storageKey);
        } catch {
          // Storage can be unavailable in privacy-restricted browser contexts.
        }

        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
